<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Ledger — Sign in</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login-view" class="view">
  <div class="cover">
    <div class="cover-inner">
      <p class="cover-eyebrow">Household Ledger</p>
      <h1 class="cover-title">Keep the books<br>together.</h1>
      <p class="cover-sub">A shared record of what comes in and what goes out. Sign in with the account you were given.</p>

      <form id="login-form" class="login-form">
        <label class="field">
          <span>Email</span>
          <input type="email" id="login-email" required autocomplete="username" placeholder="you@family.com">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
        <p class="form-error" id="login-error" hidden></p>
      </form>

      <p class="cover-note">Access is by invitation only — new accounts aren't created here. Ask whoever set up the ledger to add you in the Firebase console.</p>
    </div>
    <div class="cover-ruled" aria-hidden="true"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="login.js"></script>
</body>
</html>
